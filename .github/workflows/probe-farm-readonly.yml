name: Read-only farm diagnostics
on:
  push:
    branches: ["arena/**"]
    paths: ["tools/probe_farm_readonly.py", ".github/workflows/probe-farm-readonly.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install -q curl_cffi
      - name: Inspect resource schemas and snapshots
        env:
          IDLEARC_EMAIL: ${{ secrets.IDLEARC_EMAIL }}
          IDLEARC_PASSWORD: ${{ secrets.IDLEARC_PASSWORD }}
        run: python3 tools/probe_farm_readonly.py
