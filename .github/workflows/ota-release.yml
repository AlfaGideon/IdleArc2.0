name: Build & Publish OTA APK Release

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Описание обновления для OTA (покажется в приложении)"
        required: false
        default: ""
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
      - "arena/**"
    paths:
      - "companion/**"
      - "tools/build_companion_apk.py"
      - ".github/workflows/ota-release.yml"

permissions:
  contents: write

jobs:
  build-and-publish-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platforms & build-tools)
        uses: android-actions/setup-android@v4

      - name: Ensure Android platform 34 & build-tools + Python inspector deps
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if ! ls "$SDK_ROOT"/build-tools/*/aapt2 >/dev/null 2>&1 || ! ls "$SDK_ROOT"/platforms/android-*/android.jar >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0"
          fi
          python3 -m pip install --upgrade --break-system-packages -r requirements.txt || python3 -m pip install --upgrade -r requirements.txt

      - name: Extract version from AndroidManifest.xml
        id: ver
        run: |
          VER_NAME=$(grep -oP 'android:versionName="\K[^"]+' companion/overlay/app/src/main/AndroidManifest.xml)
          VER_CODE=$(grep -oP 'android:versionCode="\K[0-9]+' companion/overlay/app/src/main/AndroidManifest.xml)
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=IdleArcHelper-v${VER_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Verify or build signed APK with GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OTA_APK_URL: "https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version_name }}/${{ steps.ver.outputs.apk_name }}"
          OTA_CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set in GitHub Repository Secrets!"
            exit 1
          fi
          APK_PATH="releases/${{ steps.ver.outputs.apk_name }}"
          if [ -f "$APK_PATH" ] && [ -z "${OTA_CHANGELOG}" ]; then
            echo "Found pre-built signed $APK_PATH in commit — verifying integrity & SHA-256..."
            python3 -c 'import hashlib, json, pathlib, sys; m = json.loads(pathlib.Path("releases/ota-manifest.json").read_text("utf-8")); sha = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest(); sys.exit(0 if sha.lower() == m.get("sha256", "").lower() else 1)' "$APK_PATH"
          else
            python3 tools/build_companion_apk.py
          fi
          python3 tools/inspect_apk.py "releases/${{ steps.ver.outputs.apk_name }}" --output /tmp/ota_inventory.json

      - name: Verify update uses the existing signing certificate
        run: |
          python3 - "releases/IdleArcHelper-v4.1.0.apk" "releases/${{ steps.ver.outputs.apk_name }}" <<'PYCODE'
          import hashlib, sys
          from androguard.core.apk import APK
          from loguru import logger
          logger.remove()
          def certificates(path):
              return {hashlib.sha256(cert.dump()).hexdigest() for cert in APK(path).get_certificates()}
          old, new = certificates(sys.argv[1]), certificates(sys.argv[2])
          if not old or old != new:
              raise SystemExit("APK signing certificate does not match v4.1.0")
          print("Signing certificate matches v4.1.0")
          PYCODE

      - name: Publish GitHub Release & Git Tag (OTA endpoint)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version_name }}"
          APK_FILE="releases/${{ steps.ver.outputs.apk_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace a published APK. Increase the version."
            exit 1
          else
            gh release create "$TAG" "$APK_FILE" releases/ota-manifest.json \
              --target "${{ github.sha }}" \
              --title "IdleArc Druid Helper ${TAG}" \
              --notes "Подписанный OTA-релиз ${TAG} (versionCode ${{ steps.ver.outputs.version_code }})."
          fi
