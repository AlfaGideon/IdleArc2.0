name: Inspect public live transport
on:
  push:
    branches: ["arena/**"]
    paths: ["tools/probe_live_readonly.py", ".github/workflows/probe-live-readonly.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install -q curl_cffi
      - run: python3 tools/probe_live_readonly.py
        env:
          IDLEARC_EMAIL: ${{ secrets.IDLEARC_EMAIL }}
          IDLEARC_PASSWORD: ${{ secrets.IDLEARC_PASSWORD }}
