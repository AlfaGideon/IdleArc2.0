name: Build signed APK without release

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read

jobs:
  build:
    if: contains(github.event.head_commit.message, '[apk-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Ensure Android SDK and inspector dependencies
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if ! ls "$SDK_ROOT"/build-tools/*/aapt2 >/dev/null 2>&1 || ! ls "$SDK_ROOT"/platforms/android-*/android.jar >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0"
          fi
          python3 -m pip install --upgrade --break-system-packages -r requirements.txt || python3 -m pip install --upgrade -r requirements.txt
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OTA_CHANGELOG: "Помощник по общему пассивному дереву навыков."
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Release signing key is unavailable"
            exit 1
          fi
          python3 tools/build_companion_apk.py
          APK=$(python3 -c 'import re,pathlib; s=pathlib.Path("companion/overlay/app/src/main/AndroidManifest.xml").read_text(); print("releases/IdleArcHelper-v"+re.search(r"android:versionName=\"([^\"]+)\"",s).group(1)+".apk")')
          python3 tools/inspect_apk.py "$APK" --output /tmp/apk_inventory.json
          python3 - "$APK" <<'PY'
          import hashlib, sys
          from androguard.core.apk import APK
          from loguru import logger
          logger.remove()
          def certs(path):
              return {hashlib.sha256(c.dump()).hexdigest() for c in APK(path).get_certificates()}
          if not certs(sys.argv[1]) or certs(sys.argv[1]) != certs('releases/IdleArcHelper-v4.1.0.apk'):
              raise SystemExit('Signing certificate does not match the existing application')
          print('Signing certificate matches the existing application')
          PY
          mkdir -p /tmp/signed-apk
          cp "$APK" /tmp/signed-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: IdleArcHelper-signed-apk
          path: /tmp/signed-apk/*.apk
          if-no-files-found: error
          retention-days: 14
