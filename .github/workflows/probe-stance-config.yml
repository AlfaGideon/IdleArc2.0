name: Read-only public stance configuration
on:
  push:
    branches: ["arena/**"]
    paths: ["tools/probe_stance_config.py", ".github/workflows/probe-stance-config.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install -q curl_cffi
      - run: python3 tools/probe_stance_config.py
