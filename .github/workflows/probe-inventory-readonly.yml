name: Read-only inventory diagnostics
on:
  push:
    branches: ["arena/**"]
    paths:
      - "tools/probe_inventory_readonly.py"
      - ".github/workflows/probe-inventory-readonly.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install -q curl_cffi
      - name: Inspect pagination and timer fields (read-only)
        env:
          IDLEARC_EMAIL: ${{ secrets.IDLEARC_EMAIL }}
          IDLEARC_PASSWORD: ${{ secrets.IDLEARC_PASSWORD }}
        run: python3 tools/probe_inventory_readonly.py
